name: Refresh Open Lab telemetry

on:
  workflow_dispatch:
  schedule:
    - cron: '19 1 * * 1'
  push:
    branches: [main]
    paths:
      - '.github/workflows/open-lab-telemetry.yml'
      - 'scripts/render_telemetry.py'

permissions:
  contents: write

concurrency:
  group: open-lab-telemetry
  cancel-in-progress: false

jobs:
  telemetry:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - name: Render the public contribution panel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/render_telemetry.py
      - name: Publish updated panel
        run: |
          git add assets/telemetry.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh Open Lab telemetry'
          git pull --rebase
          git push
